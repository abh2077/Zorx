<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>ZORX — Digital Marketing Agency in Dubai, UAE</title>
    <meta
      name="description"
      content="ZORX is a Dubai-based digital marketing agency offering digital marketing, social media marketing, branding, website development, SEO and video production."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="canonical" href="https://www.zorx.agency/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ZORX — Digital Marketing Agency in Dubai, UAE" />
    <meta
      property="og:description"
      content="Strategy, design and technology for brands that want to lead. Digital marketing, branding, web development, SEO and video — from Dubai to the world."
    />
    <meta property="og:image" content="/assets/zorx-logo-green.png" />
    <meta property="og:url" content="https://www.zorx.agency/" />
    <meta property="og:locale" content="en_AE" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZORX — Digital Marketing Agency in Dubai, UAE" />
    <meta
      name="twitter:description"
      content="Strategy, design and technology for brands that want to lead. Based in Dubai, UAE."
    />
    <meta name="twitter:image" content="/assets/zorx-logo-green.png" />

    <!-- Favicon (uses the wordmark for now — swap in a square icon-only
         mark if you have one; browsers will letterbox this wide PNG) -->
    <link rel="icon" type="image/png" href="/assets/zorx-logo-green.png" />

    <!-- Fonts: preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data: LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MarketingAgency",
        "name": "ZORX",
        "description": "Dubai-based digital marketing agency offering digital marketing, social media marketing, branding, website development, SEO and video production.",
        "url": "https://www.zorx.agency/",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dubai",
          "addressCountry": "AE"
        },
        "email": "hello@zorx.agency",
        "sameAs": [
          "https://instagram.com/",
          "https://linkedin.com/",
          "https://x.com/",
          "https://facebook.com/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
